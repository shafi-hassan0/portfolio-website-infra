limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # style-src/font-src allow Google Fonts (the site loads Roboto, Kalam, and
    # Material Icons from fonts.googleapis.com/fonts.gstatic.com — see
    # src/index.html in portfolio-website-ui). script-src's hash allows the one
    # inline onload="this.media='all'" handler Angular's production build adds
    # to async-load stylesheets (both the Google Fonts links and the app's own
    # bundled CSS use this exact snippet) — recompute with
    # `printf "%s" "this.media='all'" | openssl dgst -sha256 -binary | openssl base64`
    # if that handler's literal text ever changes in a future Angular version.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        proxy_pass http://backend:3000/api/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://backend:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
