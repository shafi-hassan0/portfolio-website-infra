name: Seed Database

on:
  # Runs after Deploy finishes, not on push directly — this guarantees the
  # backend container has already been rebuilt with the new seed data before
  # we reseed from it, instead of racing an independent push-triggered run.
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    outputs:
      should_seed: ${{ steps.diff.outputs.should_seed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check whether seed data changed
        id: diff
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^backend/src/seed/data/'; then
            echo "should_seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_seed=false" >> "$GITHUB_OUTPUT"
          fi

  seed:
    runs-on: ubuntu-latest
    needs: [check]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.should_seed == 'true')
    steps:
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Add deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Configure SSH over Cloudflare Access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat >> ~/.ssh/config <<EOF
          Host deploy-host
            HostName ${{ secrets.SSH_HOSTNAME }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
          EOF

      - name: Seed database
        run: ssh deploy-host "cd ${{ secrets.DEPLOY_PATH }} && docker compose exec -T backend node dist/seed/seed.js"
