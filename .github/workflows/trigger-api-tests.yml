name: Trigger API Tests

on:
  # Runs after Seed Database finishes (which itself runs after Deploy), so
  # the API test suite only ever hits production once it's fully deployed
  # and reseeded — not racing either of those independently off the same push.
  workflow_run:
    workflows: ["Seed Database"]
    types: [completed]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    outputs:
      backend_changed: ${{ steps.diff.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check whether backend changed
        id: diff
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^backend/'; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
          fi

  trigger:
    runs-on: ubuntu-latest
    needs: [check]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.backend_changed == 'true')
    steps:
      - name: Dispatch portfolio-api-tests
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.API_TESTS_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-api-tests/dispatches \
            -d '{"event_type":"backend-changed"}'
