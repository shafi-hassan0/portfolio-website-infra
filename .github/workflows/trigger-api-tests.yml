name: Trigger API Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch portfolio-api-tests
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.API_TESTS_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-api-tests/dispatches \
            -d '{"event_type":"backend-changed"}'
