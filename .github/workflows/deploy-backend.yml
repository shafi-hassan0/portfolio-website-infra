name: Deploy Backend

on:
  # Fired by portfolio-website-api's trigger-deploy.yml on every push to main.
  repository_dispatch:
    types: [backend-changed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Add deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Configure SSH over Cloudflare Access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat >> ~/.ssh/config <<EOF
          Host deploy-host
            HostName ${{ secrets.SSH_HOSTNAME }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
          EOF

      - name: Deploy backend
        run: ssh deploy-host "cd ${{ secrets.DEPLOY_PATH }} && ./deploy.sh backend"

      # Only meaningful for a repository_dispatch trigger, where the api repo
      # already told us whether src/seed/data/** changed in that push.
      - name: Seed database
        if: github.event.client_payload.should_seed == 'true'
        run: ssh deploy-host "cd ${{ secrets.DEPLOY_PATH }} && docker compose exec -T backend node dist/seed/seed.js"

      # Threads the ORIGINAL portfolio-website-api commit sha through, so the
      # test suite's status report lands on the right commit over there.
      - name: Trigger API tests
        if: github.event_name == 'repository_dispatch'
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.API_TESTS_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/shafi-hassan0/portfolio-website-api-tests/dispatches \
            -d "{\"event_type\":\"backend-changed\",\"client_payload\":{\"sha\":\"${{ github.event.client_payload.sha }}\"}}"
