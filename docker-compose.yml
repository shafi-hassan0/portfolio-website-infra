services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/portfolio
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY}
    depends_on:
      - mongo
    networks:
      - internal
    volumes:
      - ./backend/public/images:/app/public/images

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
    networks:
      - internal
    volumes:
      - caddy-data:/data
      - caddy-config:/config

networks:
  internal:

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
