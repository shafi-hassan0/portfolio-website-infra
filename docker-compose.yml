services:
  mongo:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio-net
    # deliberately no ports: — internal only

  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/portfolio
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY}
    depends_on:
      - mongo
    networks:
      - portfolio-net
    volumes:
      - ./backend/public/images:/app/public/images
    # also no ports: — only nginx reaches it, over this network

  web:
    image: nginx:alpine
    container_name: portfolio-web
    restart: unless-stopped
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - portfolio-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - portfolio-net
    extra_hosts:
      # Lets this container reach sshd on the Docker host itself, since the SSH
      # public hostname route points at host.docker.internal:22 (see README).
      - "host.docker.internal:host-gateway"

networks:
  portfolio-net:
    external: true

volumes:
  mongo_data:
